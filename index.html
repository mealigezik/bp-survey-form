<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilge Panter Survey Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<header class="header">
<h1>Bilge Panter</h1>
<h2>Survey Form Demo</h2>
<p>This is a demo only. Do not enter real personal, health, or contact information.</p>
</header>
<form class="survey" id="survey-form">
<p role="note">Demo mode: responses stay in this page session only and are not submitted or stored.</p>
<div class="box"><label for="name">Display name (optional)</label><input class="social-media" type="text" id="name" name="name" autocomplete="off"></div>
<div class="box"><label for="age">Age (optional)</label><input type="number" name="age" id="age" max="123" min="3"></div>
<div class="box"><label for="area">Area of interest</label><select name="area" id="area"><option value="">Choose an option</option><option value="sport">Sport</option><option value="travel">Travel</option><option value="technology">Technology</option><option value="game">Games</option><option value="diy">DIY</option><option value="other">Other</option></select></div>
<div class="box"><label for="recommend">Would you recommend Bilge Panter?</label><select name="recommend" id="recommend"><option value="">Choose an option</option><option value="yes">Definitely, yes</option><option value="maybe">Maybe</option><option value="unsure">Not sure</option><option value="no">Definitely, no</option></select></div>
<div class="box"><label for="platform">Favourite Bilge Panter platform</label><select name="platform" id="platform"><option value="">Choose an option</option><option value="youtube">YouTube</option><option value="blog">Blog</option><option value="instagram">Instagram</option><option value="twitter">Twitter</option></select></div>
<div class="box"><label for="feedback">Suggestions (do not include personal information)</label><textarea class="social-media" name="feedback" id="feedback" rows="5"></textarea></div>
<button class="submit" type="submit">Preview demo</button><button class="submit" type="reset">Reset</button>
</form>
<section id="preview" aria-live="polite" hidden><h2>Local preview</h2><p>The preview is not uploaded or saved.</p><pre id="preview-content"></pre></section>
</main>
<script>
const form = document.getElementById("survey-form");
const preview = document.getElementById("preview");
const previewContent = document.getElementById("preview-content");
form.addEventListener("submit", event => {
  event.preventDefault();
  previewContent.textContent = JSON.stringify(Object.fromEntries(new FormData(form).entries()), null, 2);
  preview.hidden = false;
});
form.addEventListener("reset", () => { preview.hidden = true; previewContent.textContent = ""; });
</script>
</body>
</html>
